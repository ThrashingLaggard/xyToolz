name: CI/CD for __PROJECT__

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only. Without this the release step fails
# with a 403 that looks nothing like a permissions problem.
permissions:
  contents: write

# Two pushes in quick succession used to race each other and try to publish the
# same version twice.
concurrency:
  group: release-__PROJECT__
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags are the version source. A shallow clone has none of them.
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine next version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          # The old template read the current version out of the .csproj, sed'd a
          # new one in, and never committed it. Next run read the same stale value
          # again, so the version could never actually advance. Tags are the only
          # thing that survives between runs, so tags are the source of truth.
          last_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          current=${last_tag#v}
          current=${current:-0.0.0}

          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)

          subject=$(git log -1 --pretty=%s)
          body=$(git log -1 --pretty=%B)

          forced=$(echo "$body" | sed -n 's/.*[Rr]elease:[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n1)

          # First-ever release always wins over feat:/fix: keyword matching - otherwise a
          # coincidental "fix:"/"feat:" in the first commit message bumps off 0.0.0 instead
          # of starting at the intended 1.0.0. Confirmed via the equivalent bug in
          # build/post-receive during an actual sync run.
          if [ -n "$forced" ]; then
            new="$forced"
          elif [ -z "$last_tag" ]; then
            new="1.0.0"
          elif echo "$body" | grep -q 'BREAKING CHANGE'; then
            new="$((major + 1)).0.0"
          elif echo "$subject" | grep -qiE '^feat(\(.*\))?!?:'; then
            new="$major.$((minor + 1)).0"
          elif echo "$subject" | grep -qiE '^fix(\(.*\))?!?:'; then
            new="$major.$minor.$((patch + 1))"
          else
            echo "Kein Versions-Keyword -> kein Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$current -> $new"
          echo "version=$new"   >> "$GITHUB_OUTPUT"
          echo "release=true"   >> "$GITHUB_OUTPUT"

      - name: Restore
        if: steps.ver.outputs.release == 'true'
        run: dotnet restore __PROJECT__.csproj

      - name: Build
        if: steps.ver.outputs.release == 'true'
        run: |
          dotnet build __PROJECT__.csproj -c Release --no-restore \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:PackageVersion=${{ steps.ver.outputs.version }} \
            -p:GeneratePackageOnBuild=false

      - name: Test
        if: steps.ver.outputs.release == 'true'
        shell: bash
        run: |
          # The old template ran `dotnet test` against the library project itself,
          # which always failed with "no test project". Find a real one, or skip.
          test_proj=$(find . \( -iname '*Tests.csproj' -o -iname '*Test.csproj' \) | head -n1)
          if [ -n "$test_proj" ]; then
            dotnet test "$test_proj" -c Release --verbosity minimal
          else
            echo "Kein Testprojekt gefunden, uebersprungen."
          fi

      - name: Pack
        if: steps.ver.outputs.release == 'true'
        run: |
          dotnet pack __PROJECT__.csproj -c Release --no-build -o out \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:PackageVersion=${{ steps.ver.outputs.version }} \
            -p:GeneratePackageOnBuild=false

      - name: Check NuGet for existing version
        id: check
        if: steps.ver.outputs.release == 'true'
        shell: bash
        run: |
          # THE bug in the old template:
          #   exists=$(curl -sL <url>); if [ -n "$exists" ]; then skip=true
          # A 404 from the flat container still returns a non-empty body, so
          # $exists was never empty, so skip_publish was ALWAYS true, so this
          # workflow never published a single package. Check the status code.
          id=$(echo "__NUGETID__" | tr '[:upper:]' '[:lower:]')
          v="${{ steps.ver.outputs.version }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://api.nuget.org/v3-flatcontainer/$id/$v/$id.$v.nupkg" || echo 000)
          echo "HTTP $code"
          case "$code" in
            200) echo "skip=true"  >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "NuGet nicht erreichbar (HTTP $code)."; exit 1 ;;
          esac

      - name: Push to NuGet
        if: steps.ver.outputs.release == 'true' && steps.check.outputs.skip == 'false'
        run: >
          dotnet nuget push out/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.__SECRET__ }}
          --skip-duplicate

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true' && steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: out/*.nupkg
